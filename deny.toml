# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# agent-profile ships on Linux, macOS and Windows (V3 spec §37) — audit all of them.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# This workspace's crates are PolyForm-Noncommercial-1.0.0 and publish = false. Exempt them
# here rather than adding PolyForm to `allow` — that would also silently permit a
# noncommercial *dependency*, which we must never ship.
private = { ignore = true }
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = [
    # V3 spec §36/§37: agent-profile makes no hidden network requests and sends no telemetry. These are the
    # socket, HTTP and TLS choke points: a dependency that pulls one in is adding networking we did not choose.
    # A ban list is partial (an unlisted client passes, and `std::net` needs no crate): `clippy.toml` bans the
    # `std::net` socket types for our own code. If a crate here is ever legitimately needed, that is a
    # specification question first (§36), not a quiet edit of this list.
    { name = "socket2", reason = "agent-profile does no networking (V3 §36)" },
    { name = "mio", reason = "agent-profile does no networking (V3 §36)" },
    { name = "tokio", reason = "agent-profile does no networking (V3 §36)" },
    { name = "http", reason = "agent-profile does no networking (V3 §36)" },
    { name = "httparse", reason = "agent-profile does no networking (V3 §36)" },
    { name = "h2", reason = "agent-profile does no networking (V3 §36)" },
    { name = "hyper", reason = "agent-profile does no networking (V3 §36)" },
    { name = "reqwest", reason = "agent-profile does no networking (V3 §36)" },
    { name = "ureq", reason = "agent-profile does no networking (V3 §36)" },
    { name = "minreq", reason = "agent-profile does no networking (V3 §36)" },
    { name = "attohttpc", reason = "agent-profile does no networking (V3 §36)" },
    { name = "isahc", reason = "agent-profile does no networking (V3 §36)" },
    { name = "surf", reason = "agent-profile does no networking (V3 §36)" },
    { name = "openssl-sys", reason = "agent-profile does no networking (V3 §36)" },
    { name = "openssl", reason = "agent-profile does no networking (V3 §36)" },
    { name = "rustls", reason = "agent-profile does no networking (V3 §36)" },
    { name = "rustls-pki-types", reason = "agent-profile does no networking (V3 §36)" },
    { name = "webpki", reason = "agent-profile does no networking (V3 §36)" },
    { name = "native-tls", reason = "agent-profile does no networking (V3 §36)" },
    { name = "schannel", reason = "agent-profile does no networking (V3 §36)" },
    { name = "security-framework", reason = "agent-profile does no networking (V3 §36)" },
    { name = "curl-sys", reason = "agent-profile does no networking (V3 §36)" },
    { name = "curl", reason = "agent-profile does no networking (V3 §36)" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
