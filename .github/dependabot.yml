# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Patch and minor updates are collected into ONE grouped PR per ecosystem and
# auto-merged once CI is green (see .github/workflows/dependabot-automerge.yml).
# Major updates are deliberately excluded from the group, so each arrives as its
# own PR and waits for a human — majors are where MSRV bumps, breaking API
# changes and licence changes live, and deny.toml's allow-list is not advisory.
#
# The `chore`/`ci` prefixes are not cosmetic: PR titles must be Conventional Commits
# (pr-title.yml), and release-plz.toml's `release_commits` ignores `chore` and `ci`, so
# a dependency bump alone never opens a release PR.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
