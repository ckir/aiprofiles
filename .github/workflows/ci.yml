name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run from the Actions tab or `gh workflow run ci.yml --ref <branch>`, on any branch.
  workflow_dispatch:

# Least privilege, workflow-wide. Every job here runs code the pull request supplies -- `cargo nextest
# run --workspace` executes its tests, `cargo doc` its build scripts -- so the token those jobs hold is
# bounded here rather than left to the repository's default Actions permission, which is a setting outside
# this file and can be widened without anyone reading this workflow. `sandbox.yml` already pins it; this
# workflow did not. A job that needs more grants it for itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  license-headers:
    # Every source file carries header.txt, the same command `just license-check` runs. addlicense is a
    # Go tool, so it is built from a pinned module version (Go is pre-installed on ubuntu-latest); the
    # version matches the one used locally when the headers were applied.
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go install github.com/google/addlicense@v1.2.0
      - run: $(go env GOPATH)/bin/addlicense -check -f header.txt -ignore 'target/**' -ignore '.clavity/**' .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pre-installed on ubuntu-latest, so there is nothing to pin and nothing to download.
      - run: find sandbox scripts -name '*.sh' -exec shellcheck -s sh {} +

  line-citations:
    # Fails when a comment in sandbox/, crates/, .github/ or scripts/ (*.sh, *.rs, *.yml) cites another
    # file by line number instead of a symbol -- the check that stops the next one from rotting silently (see
    # scripts/check-line-citations.sh). Needs nothing beyond the checkout, so it is its own job rather than
    # a step bolted onto shellcheck.
    name: Line citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-line-citations.sh

  tools-doc:
    name: Tools doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docs/dev-tooling.md's tool table is generated from .claude/recommended-tools.json. Without this
      # job the freshness check lives only in `just check`, which CI does not run -- and the two lists had
      # already drifted once by hand, losing the `just` and `Sandboxie-Plus` rows. jq is pre-installed on
      # ubuntu-latest, and the script needs nothing else.
      - run: sh scripts/gen-tool-table.sh --check

  action-pins:
    # Every `uses:` must be a 40-hex commit SHA with a `# <ref>` comment, so a tag that is moved or a
    # branch that is pushed cannot change what this repository runs. The script and its own tests, the
    # same two commands `just action-pins` runs.
    name: Action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-action-pins.sh
      - run: sh scripts/tests/check-action-pins.sh

  evidence-staleness-tests:
    # The offline tests of the weekly staleness check (evidence-staleness.yml), the same command
    # `just evidence-staleness-tests` runs. They read no network: the script's EVIDENCE_LATEST_DIR hook
    # supplies the "latest" versions.
    name: Evidence staleness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/tests/check-evidence-staleness.sh

  probe-tests:
    # The sandbox harness's own tests: probe steps, transcript assembly, matrix resolution and the
    # privilege-split checks, the same four suites `just probe-tests` runs. No container and no agent
    # needed.
    #
    # NO COUNT IS STATED HERE ON PURPOSE. This comment used to carry one, and it rotted through every
    # value the suite passed through on this branch -- 81, then 83, then 108, then 122 -- without once
    # being updated, because nothing reads a number in a comment. A figure that only a human can refresh
    # is a claim the repository cannot keep, and this file already learned that lesson once: the tool
    # table above it is generated precisely because two hand-kept lists drifted. Before this job these four suites ran only via `just probe-tests`, which no CI
    # workflow invoked -- `grep -rn 'sandbox/tests|probe-tests|probe-harness' .github/workflows/*.yml`
    # found one comment and no `run:` line, so the evidence pipeline they guard was unchecked in CI.
    #
    # A separate job rather than a step bolted onto another: the suite takes over two minutes, which
    # would make it the long pole in whichever job it joined.
    #
    # No existing CI job uses `just` (grepped across .github/workflows/*.yml), so this invokes the four
    # suites directly with `sh` rather than installing just for one job.
    #
    # These suites have so far only run on Windows Git Bash; green on ubuntu-latest is unverified until
    # this job actually runs in CI.
    name: Probe harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh sandbox/tests/probe-harness.sh
      - run: sh sandbox/tests/transcript.sh
      - run: sh sandbox/tests/resolve-agents.sh
      - run: sh sandbox/tests/verify-transcripts.sh

  msrv:
    # `rust-version` in Cargo.toml is a promise, and nothing but this job checks it: every other job runs
    # `stable`, which compiles code the declared minimum cannot. Same command as `just msrv`. Raising
    # `rust-version` means changing the toolchain below with it; cargo refuses a toolchain older than the
    # declared version ("requires rustc 1.98"), so the two cannot drift silently.
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  clippy-matrix:
    # A warning that exists only under `cfg(windows)` or `cfg(target_os = "macos")` compiled cleanly on the
    # Linux-only job this replaces and was never linted (ROADMAP "Clippy runs on Linux only", closed here).
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy:
    # Branch protection requires a check named `Clippy`. The matrix legs are named `Clippy (<os>)`, so this
    # job keeps the required name and fails unless every leg succeeded. `!cancelled()` runs it after a
    # failed or timed-out leg (and fails it) but not after the run was cancelled, so a cancelled run does
    # not show a red Clippy. The result is read through `env`, never interpolated into the script.
    name: Clippy
    needs: [clippy-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Clippy leg to succeed
        env:
          RESULT: ${{ needs.clippy-matrix.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Clippy matrix result is '$RESULT'; see the 'Clippy (<os>)' jobs"
            exit 1
          fi
          echo "every Clippy leg succeeded"

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  docs-build:
    # Not in flux: docs.yml only runs after merge, so without this job a PR could merge with a
    # broken docs build (SP0 design §5.1). Same command as docs.yml's build step.
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

  test:
    # agent-profile launches processes, handles console signals and canonicalizes paths; all of
    # that differs per platform, so every OS is a first-class gate (V3 spec §37).
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast
      - name: Run doctests
        run: cargo test --doc --workspace

  evidence:
    # Binds every evidence transcript this pull request changes to the CI run that produced it (§5.3).
    #
    # Every gate in the contract suite checks a transcript's SHAPE. None checks that it came from
    # anywhere, and a convincing one — real run URL from the public Actions tab, plausible --help excerpt,
    # a column of zero exit codes — can be written by hand in minutes and passes all of them.
    #
    # It lives here rather than in sandbox.yml because that workflow's `pull_request` trigger carries a
    # `paths:` filter listing `sandbox/**`, so it would never fire on an evidence-only pull request; ci.yml
    # has no paths filter.
    #
    # `pull_request`, NEVER `pull_request_target`. The reflex when a fork's token cannot reach the API is
    # to switch, which would run a base-repository token against pull-request-supplied bytes. Fork
    # coverage is a separate problem and is not solved that way.
    name: Evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # `actions: read` and nothing else, and this is a SEPARATE job from the probe — which keeps
    # `contents: read`, because the probe executes third-party installers and must stay the least
    # privileged thing in the repository.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check needs the harness commit and the base branch, neither of which a
          # depth-1 checkout of the merge commit has.
          fetch-depth: 0
          persist-credentials: false

      - name: Find the transcripts this pull request changes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          files=$(git diff --name-only "$BASE" "$HEAD" -- docs/evidence/ | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "no evidence transcript changed"
          else
            echo "changed: $files"
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
        if: steps.changed.outputs.files != ''

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.files != ''

      # Building the manifest compiles pull-request-supplied Rust: the example itself, and every build
      # script of every dependency its Cargo.toml names. That is unavoidable -- the id and version must
      # come from the REGISTRY as the pull request states it, never from the filename, because
      # upstream_version permits `-` and `cursor-1.0.0-beta.1.md` splits two ways. What IS avoidable is
      # holding an API token while doing it, so this step declares none.
      - name: Build the registry manifest
        if: steps.changed.outputs.files != ''
        run: cargo run --quiet --example evidence-manifest > "$RUNNER_TEMP/manifest"

      - name: Verify each against its run
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ steps.changed.outputs.files }}
        # Nothing from a transcript is interpolated into this shell. The script opens the files itself,
        # which is what keeps a pull-request-supplied run id out of the runner's generated script.
        run: |
          set -eu
          # shellcheck disable=SC2086 # $FILES is a space-separated list of paths, and the split is wanted
          sandbox/verify-transcripts.sh "$RUNNER_TEMP/manifest" "$HEAD" $FILES
