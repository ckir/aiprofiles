name: PR title

# PRs are squash-merged with the squash commit title set to the PR title (repository setting), so the PR title
# becomes the commit on main that release-plz reads to choose the next version and write the changelog. This check (a required status check on main) keeps titles in
# Conventional Commits form, for example `feat(resolve): prefer the agent mapping`.
#
# Trigger is `pull_request`, not `pull_request_target`: the action only reads the PR title through the API
# and never checks out or runs the PR's code.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
