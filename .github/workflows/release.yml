name: Release binaries

# Builds `agent-profile` for every supported target and uploads the archives to an existing GitHub release.
# - Called by release-plz.yml right after release-plz creates the release.
# - Run by hand (Actions → Release binaries → Run workflow) with an existing tag to rebuild and re-upload
#   after a failed run; `--clobber` replaces any archive already attached.
# After the build legs, the `finalize` job writes a .sha256 beside each archive, un-drafts the release
# (release-plz.toml creates it as a draft) and dispatches docs.yml to rebuild the site.
# Only `--bin agent-profile` is built: the fake-agent test fixture never ships.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload to (for example v0.0.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (for example v0.0.2)
        required: true
        type: string

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # The legs only upload assets; the top-level `actions: write` is for `finalize` alone.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin agent-profile

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf "agent-profile-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" agent-profile

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/agent-profile.exe" -DestinationPath "agent-profile-${{ matrix.target }}.zip"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "agent-profile-${{ matrix.target }}.${{ matrix.archive }}" --clobber --repo "$GITHUB_REPOSITORY"

  finalize:
    name: Checksums and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      # No `ref:` here on purpose: the job needs scripts/release-finalize.sh from the ref that RUNS this
      # workflow (main for a real release, the feature branch for a manual dispatch), not from the release
      # tag, whose tree predates the script. Only the build legs check out the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Re-runs also download earlier .sha256 files; the script ignores them and rewrites its own.
      - name: Download archives
        run: mkdir assets && gh release download "$TAG" --dir assets --pattern 'agent-profile-*' --repo "$GITHUB_REPOSITORY"
      - name: Check all five archives are attached
        # The script only fails on zero archives; un-drafting with fewer than the five the page links to
        # would publish dead links, so finalize enforces the count itself (spec 6.1).
        run: |
          n=$(find assets -maxdepth 1 \( -name 'agent-profile-*.tar.gz' -o -name 'agent-profile-*.zip' \) | wc -l)
          if [ "$n" -ne 5 ]; then
            echo "expected 5 archives on $TAG, found $n" >&2
            exit 1
          fi
      - name: Write checksums
        run: sh scripts/release-finalize.sh "$TAG" assets
      - name: Upload checksums
        run: gh release upload "$TAG" assets/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Rebuild the site
        # The release was just un-drafted. When it is the newest published release, hand its tag to docs.yml
        # so the header does not depend on the "latest" alias having settled; a rebuild of an older tag
        # leaves the alias, and so the header, alone.
        run: |
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then set -- -f "tag=$TAG"; else set --; fi
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" "$@" || {
            echo "::error::site rebuild not dispatched; run: gh workflow run docs.yml"
            exit 1
          }
