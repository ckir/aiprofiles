name: Sandbox

# Runs sandbox/run.sh on a fresh GitHub-hosted Linux runner: probes by hand (Actions → Sandbox → Run workflow).
# The runner VM is discarded after the job, so real coding agents installed by a probe never touch a maintainer's
# machine, and pull-request CI never runs them. Results are uploaded as the `sandbox-results` artifact.
#
# No secrets are used: probes measure installs, versions, help text and dry runs, never logged-in agents.
# A pull request that changes the harness runs it in `test` mode only (the crate's suite, no agent), so the
# harness itself stays working.

on:
  pull_request:
    paths:
      - sandbox/**
      - .github/workflows/sandbox.yml
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [test, probe]
        default: probe
      agent:
        description: Agent to probe (a script in sandbox/probes/; ignored for test)
        type: string
        default: claude

permissions:
  contents: read

jobs:
  sandbox:
    name: Sandbox (${{ inputs.mode || 'test' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run in the sandbox
        env:
          AGENT_PROFILE_SANDBOX_ENGINE: podman
          MODE: ${{ inputs.mode }}
          AGENT: ${{ inputs.agent }}
        run: |
          if [ "$MODE" = probe ]; then
            sandbox/run.sh probe "$AGENT"
          else
            sandbox/run.sh test
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-results
          path: target/sandbox/
          if-no-files-found: warn
