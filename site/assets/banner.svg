<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020713"/>
      <stop offset="45%" stop-color="#051a3d"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb040" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffb040"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="50%" stop-color="#00eaff"/>
      <stop offset="100%" stop-color="#00cfff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00cfff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#techGrid)"/>

  <!-- Subtle Radial Glow Behind Center Hub -->
  <circle cx="600" cy="240" r="300" fill="#00cfff" fill-opacity="0.06"/>
  <circle cx="280" cy="240" r="180" fill="#ffb040" fill-opacity="0.05"/>
  <circle cx="920" cy="240" r="180" fill="#00eaff" fill-opacity="0.05"/>

  <!-- Left Compartment: Room 1 (Work Repo -> Client A Profile) -->
  <g transform="translate(60, 60)">
    <rect width="360" height="350" rx="12" fill="#030b1e" fill-opacity="0.9" stroke="#ffb040" stroke-width="2" filter="url(#glowEffect)"/>
    <!-- Terminal Header -->
    <rect width="360" height="36" rx="12" fill="#071533"/>
    <rect y="24" width="360" height="12" fill="#071533"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="18" r="5" fill="#27c93f"/>
    <text x="76" y="22" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="12" font-weight="600">Room 1: ~/dev/client-corp (git root)</text>

    <!-- Room Content -->
    <rect x="20" y="56" width="320" height="44" rx="6" fill="#ffb040" fill-opacity="0.1" stroke="#ffb040" stroke-width="1"/>
    <text x="32" y="76" fill="#ffb040" font-family="ui-monospace, monospace" font-size="12" font-weight="700">LINKED PROFILE: client-corp</text>
    <text x="32" y="92" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">Agent: Claude Code • Isolation: PROVEN</text>

    <text x="20" y="130" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="12">$ agent-profile claude</text>
    <text x="20" y="152" fill="#ffb040" font-family="ui-monospace, monospace" font-size="11">&gt; Resolved profile: client-corp</text>
    <text x="20" y="174" fill="#7ce7b0" font-family="ui-monospace, monospace" font-size="11">&gt; CLAUDE_CONFIG_DIR=~/.agent-profile/profiles/client-corp/claude</text>
    <text x="20" y="196" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">&gt; Spawning claude in clean workspace</text>

    <!-- Wall Indicator -->
    <rect x="20" y="230" width="320" height="88" rx="6" fill="#020815" stroke="#1e2d4d" stroke-width="1"/>
    <text x="32" y="254" fill="#ff7a18" font-family="ui-monospace, monospace" font-size="11" font-weight="700">🔒 ISOLATION GUARANTEE</text>
    <text x="32" y="274" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">• Zero credential leakage to personal</text>
    <text x="32" y="294" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">• Repo cannot override profile mapping</text>
    <text x="32" y="306" fill="#7ce7b0" font-family="ui-monospace, monospace" font-size="10">✓ Verified against sandbox harness</text>
  </g>

  <!-- Center Hub: Precedence Engine & LaunchPlan -->
  <g transform="translate(460, 90)">
    <!-- Connecting Datapath Arrows -->
    <path d="M -40 150 L 10 150" stroke="url(#amberLine)" stroke-width="3" stroke-dasharray="4 4"/>
    <polygon points="12,150 4,145 4,155" fill="#ffb040"/>

    <path d="M 270 150 L 320 150" stroke="url(#cyanLine)" stroke-width="3" stroke-dasharray="4 4"/>
    <polygon points="320,150 312,145 312,155" fill="#00eaff"/>

    <!-- Hub Vault -->
    <rect width="280" height="290" rx="14" fill="#03102c" fill-opacity="0.95" stroke="#00cfff" stroke-width="2.5" filter="url(#glowEffect)"/>

    <rect x="20" y="20" width="240" height="34" rx="8" fill="#05245c" stroke="#00eaff" stroke-width="1"/>
    <text x="140" y="42" text-anchor="middle" fill="#00eaff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">agent-profile core</text>

    <!-- Ladder Nodes -->
    <rect x="25" y="70" width="230" height="36" rx="6" fill="#071b42" stroke="#253a66" stroke-width="1"/>
    <text x="35" y="93" fill="#eaf2ff" font-family="ui-monospace, monospace" font-size="11">1. Agent Repo Mapping</text>

    <rect x="25" y="116" width="230" height="36" rx="6" fill="#071b42" stroke="#253a66" stroke-width="1"/>
    <text x="35" y="139" fill="#eaf2ff" font-family="ui-monospace, monospace" font-size="11">2. Repository Mapping</text>

    <rect x="25" y="162" width="230" height="36" rx="6" fill="#071b42" stroke="#253a66" stroke-width="1"/>
    <text x="35" y="185" fill="#eaf2ff" font-family="ui-monospace, monospace" font-size="11">3. default_profile</text>

    <rect x="25" y="210" width="230" height="54" rx="6" fill="#00cfff" fill-opacity="0.12" stroke="#00cfff" stroke-width="1.5"/>
    <text x="140" y="232" text-anchor="middle" fill="#00eaff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">LAUNCHPLAN EMITTED</text>
    <text x="140" y="250" text-anchor="middle" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="10">Adapters inspect • Launcher spawns</text>
  </g>

  <!-- Right Compartment: Room 2 (Personal Repo -> OSS / Personal Profile) -->
  <g transform="translate(780, 60)">
    <rect width="360" height="350" rx="12" fill="#030b1e" fill-opacity="0.9" stroke="#00cfff" stroke-width="2" filter="url(#glowEffect)"/>
    <!-- Terminal Header -->
    <rect width="360" height="36" rx="12" fill="#071533"/>
    <rect y="24" width="360" height="12" fill="#071533"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="18" r="5" fill="#27c93f"/>
    <text x="76" y="22" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="12" font-weight="600">Room 2: ~/oss/hobby-tools (git root)</text>

    <!-- Room Content -->
    <rect x="20" y="56" width="320" height="44" rx="6" fill="#00cfff" fill-opacity="0.1" stroke="#00cfff" stroke-width="1"/>
    <text x="32" y="76" fill="#00eaff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">LINKED PROFILE: personal-oss</text>
    <text x="32" y="92" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">Agent: Codex / Aider • Isolation: PROVEN</text>

    <text x="20" y="130" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="12">$ agent-profile codex</text>
    <text x="20" y="152" fill="#00eaff" font-family="ui-monospace, monospace" font-size="11">&gt; Resolved profile: personal-oss</text>
    <text x="20" y="174" fill="#7ce7b0" font-family="ui-monospace, monospace" font-size="11">&gt; CODEX_HOME=~/.agent-profile/profiles/personal-oss/codex</text>
    <text x="20" y="196" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">&gt; Spawning codex in clean workspace</text>

    <!-- Wall Indicator -->
    <rect x="20" y="230" width="320" height="88" rx="6" fill="#020815" stroke="#1e2d4d" stroke-width="1"/>
    <text x="32" y="254" fill="#00cfff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">🔒 ISOLATION GUARANTEE</text>
    <text x="32" y="274" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">• Clean personal config &amp; history</text>
    <text x="32" y="294" fill="#9db3d6" font-family="ui-monospace, monospace" font-size="11">• Zero telemetry or analytics outbound</text>
    <text x="32" y="306" fill="#7ce7b0" font-family="ui-monospace, monospace" font-size="10">✓ Verified against sandbox harness</text>
  </g>
</svg>
