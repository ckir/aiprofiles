# Agent Profile workspace root.
#
# Virtual workspace: no root package. The shipped binary is `agent-profile`, produced by
# crates/agent-profile. Its second binary, fake-agent, is a test-only fixture and never ships.

[workspace]
resolver = "3"
members = [
    "crates/agent-profile",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ckir/aiprofiles"
publish = false

# Shared version registry. Listing a crate here pins ONE version for the whole workspace;
# it does NOT add it to any crate — members opt in with `foo = { workspace = true }`.
# Pins are copied from flux; later sub-projects add crates in their own specs.
[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
thiserror = "2"
tempfile = "3"
proptest = "1.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"

# The profile the release workflow ships from. `agent-profile` is a short-lived wrapper that resolves a
# profile and then hands off to the agent, so build time is worth trading for size and startup.
#
# `panic = "abort"` is safe here rather than merely smaller: nothing in `src/` catches unwinds, implements
# `Drop` for cleanup, or holds a lock across a section -- `config.rs` writes through a temporary file and
# an atomic rename, so an abort mid-write leaves a stray temp file and never a half-written destination.
# Cargo ignores this setting for test and bench profiles, so `cargo test --release` still builds.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
